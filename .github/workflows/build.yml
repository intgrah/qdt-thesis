name: Build & publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Install FiraCode Nerd Font
        run: |
          mkdir -p fonts
          curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip -o /tmp/firacode.zip
          unzip -q /tmp/firacode.zip -d fonts
      - run: typst compile --font-path fonts main.typ
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: main.pdf

  pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf
          path: public
      - run: echo '<meta http-equiv=refresh content="0;url=main.pdf">' > public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: main.pdf
          make_latest: 'true'
